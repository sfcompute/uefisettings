name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl -p uefisettings-cli
      - name: Package
        run: |
          name=uefisettings-x86_64-unknown-linux-musl
          mkdir dist
          cp target/x86_64-unknown-linux-musl/release/uefisettings "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
      # Tags with a suffix (v0.1.6-rc.1) are prereleases, so they can be tested before merging.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}"
