[workspace]
resolver = "2"
members = [
    "crates/uefisettings",
    "crates/uefisettings-cli",
    "thrift/rust/uefisettings_backend_thrift",
    "thrift/rust/uefisettings_spellings_db_thrift",
]

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "BSD-3-Clause"
homepage = "https://github.com/linuxboot/uefisettings"

[workspace.lints.clippy]
complexity = "warn"
correctness = "warn"
pedantic = "warn"
perf = "warn"
style = "warn"
suspicious = "warn"
