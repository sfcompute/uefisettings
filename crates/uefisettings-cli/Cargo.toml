[package]
name = "uefisettings-cli"
description = "Command line interface for the uefisettings tool to read/get/extract and write/change/modify BIOS/UEFI settings from Linux terminal."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true

[[bin]]
name = "uefisettings"
path = "src/main.rs"

[dependencies]
uefisettings = { path = "../uefisettings", version = "0.1.5" }
uefisettings_backend_thrift = { path = "../../thrift/rust/uefisettings_backend_thrift", version = "0.1.0" }
uefisettings_spellings_db_thrift = { path = "../../thrift/rust/uefisettings_spellings_db_thrift", version = "0.1.0" }
anyhow = "1.0"
fbthrift = ">=0.0"
clap = { package = "clap", version = "3.2.25", features = ["derive", "env", "regex", "unicode", "wrap_help"] }
log = { version = "0.4", features = ["kv_unstable", "kv_unstable_std"] }
env_logger = "0.10"

[lints]
workspace = true
