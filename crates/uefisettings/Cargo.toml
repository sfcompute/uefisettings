[package]
name = "uefisettings"
description = "The tool to read/get/extract and write/change/modify BIOS/UEFI settings from Linux terminal."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true

[lib]
name = "uefisettings"
path = "src/lib.rs"

[dependencies]
uefisettings_backend_thrift = { path = "../../thrift/rust/uefisettings_backend_thrift", version = "0.1" }
uefisettings_spellings_db_thrift = { path = "../../thrift/rust/uefisettings_spellings_db_thrift", version = "0.1" }
anyhow = "1"
log = "0.4"
nix = { version = "0.27", features = ["fs", "ioctl", "mount"] }
binrw = "0.13"
proc-mounts = "0.3"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
