[package]
name = "uefisettings"
description = "The tool to read/get/extract and write/change/modify BIOS/UEFI settings from Linux terminal."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true

[lib]
name = "uefisettings"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
log = "0.4"
nix = { version = "0.31", features = ["fs", "ioctl", "mount"] }
binrw = "0.13"
proc-mounts = "0.3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
